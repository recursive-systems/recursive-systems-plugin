name: Plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the marketplace
        run: claude plugin validate --strict .
      - name: Validate the plugin
        run: claude plugin validate --strict plugins/recursive-systems
      - name: Versions match
        run: |
          a=$(jq -r .version plugins/recursive-systems/.claude-plugin/plugin.json)
          b=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          test "$a" = "$b" || { echo "plugin.json $a != marketplace.json $b"; exit 1; }
          grep -q "^## \[$a\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $a"; exit 1; }
      - name: Skill descriptions aren't cut off
        # An unquoted front matter value ends at " #" (YAML reads the rest as a comment), and validate still passes.
        run: |
          bad=0
          for f in plugins/recursive-systems/skills/*/SKILL.md; do
            awk 'NR==1{next} /^---$/{exit} {print}' "$f" | grep -nE "^[A-Za-z_-]+: [^\"'|>].* #" \
              && { echo "::error file=$f::unquoted front matter value contains ' #': quote it"; bad=1; }
          done
          exit $bad
